<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Email</title>
</head>

<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:40px 0;">
<tr>
<td align="center">

<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;">

<tr>
<td style="background:#343537;padding:30px;text-align:center;">
<h1 style="margin:0;color:#ffffff;">Chat App</h1>
</td>
</tr>

<tr>
<td style="padding:40px;">

<h2 style="margin-top:0;color:#333;">
Verify Your Email
</h2>

<p style="font-size:16px;color:#555;line-height:1.6;">
Thank you for creating an account.
Use the verification code below to complete your registration.
</p>

<div style="margin:35px 0;text-align:center;">
<span style="
display:inline-block;
padding:18px 36px;
font-size:34px;
font-weight:bold;
letter-spacing:8px;
background:#f3f4f6;
border:2px dashed #474747;
border-radius:8px;
color:#373737;">
{{otp}}
</span>
</div>

<p style="font-size:15px;color:#666;">
This code expires in
<strong>{{expire_minutes}} minutes</strong>.
</p>

<p style="font-size:15px;color:#666;">
If you didn't request this email, you can safely ignore it.
</p>

</td>
</tr>

<tr>
<td style="padding:25px;text-align:center;background:#f9fafb;color:#888;font-size:13px;">
© Chat App. All rights reserved.
</td>
</tr>

</table>

</td>
</tr>
</table>

</body>
</html>
